<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: Fraunces;
    src: url("Fraunces-normal-640.woff2") format("woff2");
    font-weight: 500 700;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: "Source Serif 4";
    src: url("SourceSerif4-normal-560.woff2") format("woff2");
    font-weight: 400 600;
    font-style: normal;
    font-display: block;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #F4EFE4;
    color: #2C2416;
  }
  body {
    display: grid;
    grid-template-columns: 1fr 560px;
    font-family: "Source Serif 4", "Liberation Serif", Palatino, serif;
  }
  .spine {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 14px;
    background: #3E4A36;
  }
  .copy {
    position: relative;
    padding: 52px 40px 52px 78px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  h1 {
    font-family: Fraunces, "Liberation Serif", Palatino, serif;
    font-weight: 560;
    font-size: 40px;
    line-height: 1;
    letter-spacing: -0.025em;
    color: #2C2416;
    font-optical-sizing: auto;
  }
  h1 .name {
    display: block;
    margin-top: 10px;
    font-size: 96px;
    font-weight: 640;
    letter-spacing: -0.035em;
    line-height: 0.86;
  }
  h1 .series {
    display: block;
    margin-top: 16px;
    font-size: 28px;
    font-weight: 520;
    letter-spacing: -0.02em;
    line-height: 1.15;
    color: #2C2416;
  }
  .rule {
    width: 84px;
    height: 4px;
    background: #C4622D;
    margin: 26px 0 18px;
  }
  .by {
    font-size: 22px;
    line-height: 1.35;
    color: #3E4A36;
    font-weight: 460;
  }
  .plate-wrap {
    padding: 32px 32px 32px 8px;
    display: flex;
  }
  .plate {
    flex: 1;
    background: #F4EFE4;
    border: 1px solid rgba(44, 36, 22, 0.45);
    box-shadow: 0 10px 28px rgba(44, 36, 22, 0.12);
    overflow: hidden;
    position: relative;
  }
  .plate img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 68%;
    display: block;
  }
</style>
</head>
<body>
  <div class="spine"></div>
  <div class="copy">
    <h1>Volume 8: <span class="name">Onions</span> <span class="series">(The Education Revolution)</span></h1>
    <div class="rule"></div>
    <p class="by">A free pocket guide<br>by Blue and the Awesome Dudes</p>
  </div>
  <div class="plate-wrap">
    <div class="plate">
      <img src="plate.jpg" alt="">
    </div>
  </div>
</body>
</html>
